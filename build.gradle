plugins {
	id 'java'
	// Linter y cobertura (#13). Ver "Linter y cobertura" en Decisiones técnicas de SnippetSearcher.
	id 'checkstyle'
	id 'pmd'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.snippetsearcher'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
	// La librería de PrintScript se publica en GitHub Packages. Bajarla pide un
	// token classic con read:packages, aunque el repo sea público.
	// En local se toma de ~/.gradle/gradle.properties (gpr.user y gpr.key);
	// en el CI y en Docker, de la variable PACKAGES_TOKEN. Nunca se commitea.
	maven {
		url = 'https://maven.pkg.github.com/MartinaCousido/PrintScript'
		credentials {
			username = providers.gradleProperty('gpr.user')
					.orElse(providers.environmentVariable('PACKAGES_USER'))
					.getOrElse('MartinaCousido')
			password = providers.gradleProperty('gpr.key')
					.orElse(providers.environmentVariable('PACKAGES_TOKEN'))
					.getOrNull()
		}
		content {
			includeGroup 'org.printscript'
		}
	}
}

// Agente Java de New Relic (#9): Gradle lo baja de Maven Central, pero no entra
// al classpath; el Dockerfile lo engancha con -javaagent. Igual que el Asset
// Service de la cátedra. Ver Observabilidad (New Relic) en Decisiones técnicas
// de SnippetSearcher.
ext {
	set('newRelicVersion', '9.5.0')
}

configurations {
	newrelic {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

dependencies {
	newrelic "com.newrelic.agent.java:newrelic-agent:${newRelicVersion}"
	implementation 'org.printscript:runner:0.3.1'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Deja el agente (build/newrelic/newrelic.jar) junto a su configuración
// (newrelic.yml, que el agente lee de su misma carpeta).
tasks.register('copyNewRelic', Sync) {
	from(configurations.newrelic) {
		rename { 'newrelic.jar' }
	}
	from('newrelic') {
		include 'newrelic.yml'
	}
	into layout.buildDirectory.dir('newrelic')
}

// Solo se genera el jar ejecutable de Spring Boot (bootJar), no el jar "plain":
// el Dockerfile copia el único jar que queda en build/libs.
tasks.named('jar') {
	enabled = false
}

// Linter: Checkstyle (convenciones) y PMD (errores probables), con la
// configuración de la librería PrintScript adaptada a este servicio. Versiones
// fijas: el mismo código tiene que dar el mismo resultado en cualquier máquina.
// Cualquier violación hace fallar ./gradlew build, y con él el CI.
checkstyle {
	toolVersion = '10.21.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	ignoreFailures = false
	maxWarnings = 0
}

pmd {
	toolVersion = '7.26.0'
	ruleSetFiles = files('config/pmd/ruleset.xml')
	// Sin esto, el plugin suma su ruleset por defecto al nuestro.
	ruleSets = []
	ignoreFailures = false
	consoleOutput = true
}

tasks.named('pmdTest') {
	ruleSetFiles = files('config/pmd/ruleset-test.xml')
}

// Cobertura: JaCoCo, con un mínimo de 80 % de líneas. Solo queda afuera la
// clase que arranca Spring, que no tiene lógica.
jacoco {
	toolVersion = '0.8.14'
}

def fueraDeCobertura = ['**/PrintScriptApplication.class']

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude fueraDeCobertura } }))
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('jacocoTestReport')
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				minimum = 0.80
			}
		}
	}
	classDirectories.setFrom(files(classDirectories.files.collect { fileTree(it) { exclude fueraDeCobertura } }))
}

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}
