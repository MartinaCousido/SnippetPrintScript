# Compila y testea el servicio en cada PR hacia dev o main.
# Si la compilación o algún test falla, el check del PR queda en rojo.
name: CI

on:
  pull_request:
    branches: [dev, main]

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compilar-y-testear:
    runs-on: ubuntu-latest
    env:
      # Para bajar la librería de PrintScript de GitHub Packages. El token del
      # workflow (GITHUB_TOKEN) no alcanza: solo llega a los paquetes de este repo.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Cachea las dependencias de Gradle entre corridas.
      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar y testear
        run: ./gradlew build --no-daemon
